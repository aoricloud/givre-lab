[package]
name = "givre-lab"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "givre"
path = "src/main.rs"

[dependencies]

# Une fonctionnalité par étape : ses tests portent #[cfg_attr(not(feature = "etape-<n>"), ignore)] tant qu'elle n'est
# pas dans `default`. La vague du code d'une étape ajoute son nom à `default`, et rien d'autre ici.
[features]
default = ["etape-0", "etape-2s", "etape-1", "etape-3", "etape-4", "etape-2", "etape-5", "etape-3-bord", "etape-z1", "etape-d1", "etape-d2", "etape-d3", "etape-g1", "etape-v7", "etape-g2"]
etape-0 = []
etape-1 = []
etape-2 = []
etape-2s = []
etape-3 = []
etape-4 = []
etape-5 = []
etape-3-bord = []
etape-z1 = []
etape-d1 = []
etape-d2 = []
etape-d3 = []
etape-g1 = []
etape-v7 = []
etape-g2 = []

# Les tests de simulation (agrégats, surfaces, Monte-Carlo) sont lourds : le profil de test est optimisé. Les
# vérifications de débordement restent actives. Ne pas le changer sans PR à part.
[profile.dev]
opt-level = 3
